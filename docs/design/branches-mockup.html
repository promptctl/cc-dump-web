<!doctype html>
<html><head><meta charset="utf-8"><title>Branches & subagents: four proposals on one recording</title>
<style>
:root{--bg:#1e1e24;--surface:#26262e;--panel:#30303a;--fg:#d8d8e0;--muted:#8a8a99;--dim:#55556a;--border:#4a7fd8;--added:#4caf7a;
 --c-system:#a97bd9;--c-user:#5b9bd5;--c-assistant:#6ccf8a;--c-tool_use:#e8a04a;--c-tool_result:#d9c75b;--c-thinking:#8a8a99;--c-fork:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,Inter,system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto auto 1fr;}
header{background:var(--surface);padding:8px 14px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
header b{font-weight:600}
.toggle{display:inline-flex;border:1px solid var(--dim);border-radius:4px;overflow:hidden}
.toggle span{padding:2px 10px;cursor:pointer;color:var(--muted)}
.toggle span.on{background:var(--panel);color:var(--fg)}
header .help{color:var(--muted);margin-left:auto;font-size:12px}
#strip{background:var(--surface);padding:6px 14px 8px;display:flex;gap:6px;align-items:flex-end;border-top:1px solid #000}
.mark{width:14px;height:18px;border-radius:2px;background:var(--fg);cursor:pointer;position:relative;display:flex;align-items:flex-end;justify-content:center;font-size:9px;color:var(--bg)}
.mark.hollow{background:transparent;border:1px solid var(--dim);color:var(--dim)}
.mark.dot{height:6px;background:var(--dim);color:transparent}
.mark.chosen{outline:2px solid var(--border);outline-offset:1px}
.mark.nest::after{content:"";position:absolute;left:2px;right:2px;bottom:-4px;height:2px;background:var(--muted)}
.mark.notch::before{content:"";position:absolute;left:5px;top:-5px;width:4px;height:4px;background:var(--c-fork);transform:rotate(45deg)}
main{display:grid;grid-template-columns:1fr 34px;min-height:0}
#col{overflow:auto;padding:8px 0 40vh;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:baseline;gap:10px;padding:1px 14px 1px 0;border-left:3px solid transparent;white-space:nowrap}
.row.added{border-left-color:var(--added)}
.row.focus{background:var(--panel)}
.row .ind{flex:none;width:calc(14px + var(--d)*22px);display:flex;justify-content:flex-end;gap:4px}
.row .ind i{display:block;width:2px;height:1.45em;background:var(--dim);margin-right:16px}
.x{color:var(--muted)}
.x b{color:var(--fg);font-weight:600;margin-right:12px}
.x span{margin-right:14px}
.head{color:var(--muted);font-size:11px;letter-spacing:.06em;margin-top:4px}
.blk .g{display:inline-block;width:4px;height:1.1em;vertical-align:-2px;margin-right:8px;background:var(--c)}
.blk .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--fg)}
.blk .n{color:var(--muted);margin-left:auto;padding-left:20px}
.fork{color:var(--muted);margin:4px 0}
.fork .sib{padding:0 6px;cursor:pointer;border-radius:3px}
.fork .sib.on{color:var(--fg);font-weight:600;background:var(--panel)}
.fork .sib:hover{color:var(--fg)}
.nest{color:var(--muted);cursor:pointer}
.nest .mono{font-family:ui-monospace,Menlo,monospace;color:var(--fg)}
.nest .live{color:var(--added)}
.crumb{position:sticky;top:0;background:var(--surface);padding:4px 14px;color:var(--muted);z-index:1}
.crumb b{color:var(--fg)}
#mini{background:var(--surface);display:grid;grid-template-columns:10px 1fr;gap:0 2px;padding:6px 3px;align-content:start;cursor:pointer;position:relative}
#mini .s{height:3px;margin-bottom:1px}
#mini .g{height:3px;margin-bottom:1px;font-size:8px;line-height:3px;color:var(--muted);position:relative}
#mini .g i{position:absolute;top:0;bottom:-1px;width:2px;background:var(--muted)}
#mini .g.notch::before{content:"";position:absolute;left:0;top:-1px;width:5px;height:5px;background:var(--c-fork);transform:rotate(45deg)}
#mini .box{position:absolute;left:0;right:0;border:1px solid var(--border);pointer-events:none;opacity:.7}
#foot{position:fixed;right:48px;bottom:10px;color:var(--muted);font-size:12px;background:var(--surface);padding:3px 10px;border-radius:4px}
</style></head><body>
<header>
 <b>Branches &amp; subagents</b>
 <span>History: <span class="toggle" id="tHist"><span data-v="kept">kept choice</span><span data-v="one">one state</span></span></span>
 <span>Subagents: <span class="toggle" id="tSub"><span data-v="spliced">spliced inline</span><span data-v="entered">entered</span></span></span>
 <span class="help" id="help"></span>
</header>
<div id="strip"></div>
<main><div id="col"></div><div id="mini"></div></main>
<div id="foot"></div>
<script>
// ---------- the recording: steps in arrival order, lines, forks, nests ----------
const U=(t)=>({role:'USER',cat:'user',text:t}), A=(t)=>({role:'ASSISTANT',cat:'assistant',text:t}),
      TU=(t,anchor)=>({role:'ASSISTANT',cat:'tool_use',text:t,anchor}), TR=(t)=>({role:'USER',cat:'tool_result',text:t}),
      TH=(t)=>({role:'ASSISTANT',cat:'thinking',text:t}), SYS=(t)=>({role:'SYSTEM',cat:'system',text:t});
const steps={
 1:{line:'main',t:'14:03:02',m:'opus-5-5',blocks:[SYS('You are Claude Code… (12k)'),U('list the files in this directory'),TH('A quick ls.'),TU('Bash  ls -la','1:bash')]},
 2:{line:'main',t:'14:03:05',m:'opus-5-5',blocks:[TR('total 88  drwxr-xr-x  docs  packages  package.json …'),A('Six entries: docs, packages, package.json, pnpm-lock…')]},
 3:{line:'main',t:'14:04:10',m:'opus-5-5',blocks:[U('launch two subagents in parallel: one counts .md files, one counts .ts files'),TU('Agent  count the .md files','3:a'),TU('Agent  count the .ts files','3:b')]},
 4:{line:'A',t:'14:04:12',m:'haiku-5-5',blocks:[SYS('You are a general-purpose agent… (3k)'),U('count the .md files'),TU('Bash  find . -name "*.md" | wc -l','4:bash')]},
 5:{line:'B',t:'14:04:12',m:'haiku-5-5',blocks:[SYS('You are a general-purpose agent… (3k)'),U('count the .ts files'),TH('src is large; delegate the walk.'),TU('Agent  walk packages/ and list .ts files','5:c')]},
 6:{line:'A',t:'14:04:14',m:'haiku-5-5',blocks:[TR('7'),A('There are 7 Markdown files.')]},
 7:{line:'C',t:'14:04:15',m:'haiku-5-5',blocks:[SYS('You are an Explore agent… (2k)'),U('walk packages/ and list .ts files'),TU('Bash  find packages -name "*.ts"','7:bash')]},
 8:{line:'C',t:'14:04:17',m:'haiku-5-5',blocks:[TR('packages/ui/src/view/rows.ts …(41 lines)'),A('41 TypeScript files, listed above.')]},
 9:{line:'B',t:'14:04:18',m:'haiku-5-5',blocks:[TR('41 TypeScript files, listed above.'),A('There are 41 .ts files.')]},
 10:{line:'main',t:'14:04:20',m:'opus-5-5',blocks:[TR('There are 7 Markdown files.'),TR('There are 41 .ts files.'),A('7 Markdown and 41 TypeScript files.')]},
 11:{line:'X',t:'14:06:01',m:'opus-5-5',blocks:[U('what does the README say?'),TU('Read  README.md','11:read')]},
 12:{line:'Y',t:'14:06:30',m:'opus-5-5',blocks:[U('rename package.json\'s name field to cc-dump-web'),TU('Edit  package.json','12:edit')]},
 13:{line:'X',t:'14:06:04',m:'opus-5-5',blocks:[TR('# cc-dump-web\nRecords Claude Code\'s API traffic…'),A('It describes the proxy and the web UI.')]},
 14:{line:'Y',t:'14:06:33',m:'opus-5-5',blocks:[TR('Edited.'),A('Renamed. The lockfile is unaffected.')]},
 15:{line:'btw',t:'14:07:02',m:'opus-5-5',blocks:[U('/btw  is pnpm or npm in use here?'),A('pnpm: there is a pnpm-lock.yaml and a pnpm-workspace.yaml.')]},
 16:{line:'Y',t:'14:07:40',m:'opus-5-5',blocks:[U('now run the tests'),TU('Bash  pnpm test','16:bash')]},
 17:{line:'Y',t:'14:07:58',m:'opus-5-5',blocks:[TR('427 passed'),A('All 427 tests pass.')]},
};
// lines: root; fork {of, after}: leaves line `of` after its step `after`; nest {anchor}: hangs from a tool_use block
const lines={
 main:{steps:[1,2,3,10],label:'main'},
 A:{steps:[4,6],nest:{of:'main',anchor:'3:a'},label:'Agent · count the .md files'},
 B:{steps:[5,9],nest:{of:'main',anchor:'3:b'},label:'Agent · count the .ts files'},
 C:{steps:[7,8],nest:{of:'B',anchor:'5:c'},label:'Agent · walk packages/'},
 X:{steps:[11,13],fork:{of:'main',after:10},label:'original'},
 Y:{steps:[12,14,16,17],fork:{of:'main',after:10},label:'/branch'},
 btw:{steps:[15],fork:{of:'Y',after:14},label:'/btw'},
};
const LAST=17, order=Object.keys(steps).map(Number);
const parentOf=l=>lines[l].fork?lines[l].fork.of:lines[l].nest?lines[l].nest.of:null;
const chain=l=>{const c=[];for(let x=l;x;x=parentOf(x))c.push(x);return c;};
const forksAt=(l,after)=>Object.keys(lines).filter(k=>lines[k].fork&&lines[k].fork.of===l&&lines[k].fork.after===after);
const nestsAt=anchor=>Object.keys(lines).filter(k=>lines[k].nest&&lines[k].nest.anchor===anchor);
const first=l=>lines[l].steps[0], lastLE=(l,s)=>lines[l].steps.filter(x=>x<=s).pop();
const previewStep=sp=>{const b=steps[sp].blocks.find(b=>b.cat==='user');return b?b.text.slice(0,28):'';};

// ---------- state ----------
const q=new URLSearchParams(location.search);
const st={hist:q.get('hist')||'kept',sub:q.get('sub')||'spliced',step:+(q.get('step')||LAST),choice:{},closed:new Set(),stack:[],focus:0};
for(const c of (q.get('close')||'').split(',').filter(Boolean)) st.closed.add(c);

// the sibling shown at a fork point. siblings = [parent continuation (if any step after), ...children]
function siblingsAt(l,after,s){
 const sibs=[];
 if(lines[l].steps.some(x=>x>after)) sibs.push(l);
 for(const k of forksAt(l,after)) sibs.push(k);
 return sibs.filter(k=>k===l?lines[l].steps.some(x=>x>after&&x<=s):first(k)<=s);
}
function shownAt(l,after,s,sibs){
 const key=l+'@'+after;
 if(st.hist==='kept'&&st.choice[key]&&sibs.includes(st.choice[key])) return st.choice[key];
 if(st.hist==='one'){const ch=chain(steps[s].line); const on=sibs.find(k=>k!==l&&ch.includes(k)); if(on) return on; if(sibs.includes(l)&&ch.includes(l)&&lines[l].steps.some(x=>x>after&&x<=s)) return l;}
 // default: the sibling with the latest step at or before s
 return sibs.slice().sort((a,b)=>lastLE(b,s)-lastLE(a,s))[0];
}

// ---------- which steps are in the column (for the strip) and the rows ----------
let rows=[], visible=new Set();
function build(){
 rows=[]; visible=new Set();
 const s=st.step;
 const top=st.sub==='entered'&&st.stack.length?st.stack[st.stack.length-1]:null;
 if(top){rows.push({kind:'crumb',text:['main',...st.stack].map(l=>lines[l].label).join('  ›  ')}); renderLine(top,0,s,0);}
 else renderLine('main',0,s,0);
 if(st.sub==='entered'){ // steps of entered nests are "in the column" for the strip even when not at top? no: only the top line's rows are listed
 }
 st.focus=Math.min(st.focus,rows.length-1);
}
function renderLine(l,depth,s,from){
 const L=lines[l];
 for(const sp of L.steps){
  if(sp<=from) continue;
  if(sp>s) return;
  const e=steps[sp]; visible.add(sp);
  const added=sp===s;
  rows.push({kind:'x',depth,step:sp,added,text:`${sp}`,facts:`${e.t}  ${e.m}  ${l==='main'?'':'·'}`});
  let role=null;
  for(const b of e.blocks){
   if(b.role!==role){role=b.role;rows.push({kind:'head',depth,added,text:role});}
   rows.push({kind:'blk',depth,added,cat:b.cat,text:b.text.split('\n')[0],n:b.text.length});
   if(b.anchor){ for(const n of nestsAt(b.anchor)){ if(first(n)>s) continue; renderNest(n,depth,s); } }
  }
  // fork point after this step?
  const sibs=siblingsAt(l,sp,s);
  if(sibs.length>=2){
   const shown=shownAt(l,sp,s,sibs);
   rows.push({kind:'fork',depth,line:l,after:sp,sibs,shown});
   if(shown!==l){ renderLine(shown,depth,s,0); return; }
  } else if(sibs.length===1&&sibs[0]!==l){ renderLine(sibs[0],depth,s,0); return; }
 }
}
function renderNest(n,depth,s){
 const running=lastLE(n,s)===s||(lastLE(n,s)!==lines[n].steps[lines[n].steps.length-1]&&lines[n].steps.some(x=>x>s));
 const k=lastLE(n,s), latest=steps[k].blocks[steps[k].blocks.length-1].text.split('\n')[0];
 const count=lines[n].steps.filter(x=>x<=s).length;
 if(st.sub==='entered'){ rows.push({kind:'nest',depth,line:n,enter:true,running,text:`${lines[n].label}  ·  ${count} steps`,latest}); markNestVisible(n,s); return; }
 rows.push({kind:'nest',depth,line:n,running,open:!st.closed.has(n),text:`${lines[n].label}  ·  ${count} steps`,latest});
 if(st.closed.has(n)){ markNestVisible(n,s); return; }
 renderLine(n,depth+1,s,0);
}
function markNestVisible(n,s){ // a closed or un-entered nest still counts as in the column, as a region does
 for(const x of lines[n].steps) if(x<=s) visible.add(x);
 for(const sp of lines[n].steps) for(const b of steps[sp].blocks) if(b.anchor) for(const m of nestsAt(b.anchor)) markNestVisible(m,s);
}

// ---------- drawing ----------
const $=id=>document.getElementById(id);
function draw(keepFork){
 const col=$('col');
 const anchorY=keepFork?forkY(keepFork):null;
 build();
 col.innerHTML=rows.map((r,i)=>{
  const f=i===st.focus?' focus':'', a=r.added?' added':'', ind=`<span class="ind" style="--d:${r.depth||0}">${'<i></i>'.repeat(r.depth||0)}</span>`;
  switch(r.kind){
   case 'crumb': return `<div class="crumb">${r.text.replace(/›([^›]*)$/,'› <b>$1</b>')}   <span style="float:right">u · up</span></div>`;
   case 'x': return `<div class="row x${a}${f}">${ind}<b>${r.text}</b><span>${r.facts}</span></div>`;
   case 'head': return `<div class="row head${a}${f}">${ind}${r.text}</div>`;
   case 'blk': return `<div class="row blk${a}${f}">${ind}<span class="g" style="--c:var(--c-${r.cat})"></span><span class="mono">${esc(r.text)}</span><span class="n">${r.n}</span></div>`;
   case 'fork': return `<div class="row fork${f}" data-fork="${r.line}@${r.after}">${ind}⑂ ${r.sibs.length} histories here: ${r.sibs.map(k=>`<span class="sib${k===r.shown?' on':''}" data-sib="${k}">${k===r.line?'continues':lines[k].label} ${k===r.line?lines[k].steps.find(x=>x>r.after):first(k)}  “${esc(previewStep(k===r.line?lines[k].steps.find(x=>x>r.after):first(k))).slice(0,26)}…”</span>`).join(' ')}</div>`;
   case 'nest': return `<div class="row nest${a}${f}" data-nest="${r.line}">${ind}${r.enter?'▸':r.open?'▾':'▸'} <span class="mono">${r.text}</span>${r.running?`  <span class="live">● ${esc(r.latest).slice(0,40)}</span>`:`  <span>${esc(r.latest).slice(0,40)}</span>`}${r.enter?'  <span>Enter · open</span>':''}</div>`;
  }}).join('');
 if(anchorY!=null){const y=forkY(keepFork); if(y!=null) col.scrollTop+=y-anchorY;}
 drawStrip(); drawMini();
 $('help').textContent=st.hist==='one'
  ?'←/→ step in time (crosses forks)   [ ] sibling at the nearest fork above   j/k focus   Enter open/close'+(st.sub==='entered'?' / enter   u up':'')
  :'←/→ step along the shown history   b/B next/prev fork   [ ] switch at the focused fork   j/k focus   Enter open/close'+(st.sub==='entered'?' / enter   u up':'');
 $('foot').textContent=`step ${st.step} of ${LAST} · ${st.hist==='one'?'the chosen step is the only state':'chosen: '+(Object.entries(st.choice).map(([k,v])=>k+'→'+lines[v].label).join(', ')||'defaults')}`;
}
function forkY(key){const el=document.querySelector(`[data-fork="${key}"]`);return el?el.getBoundingClientRect().top:null;}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function drawStrip(){
 $('strip').innerHTML=order.map(sp=>{
  const l=steps[sp].line, inCol=visible.has(sp), nest=!!lines[l].nest;
  const notch=Object.keys(lines).some(k=>lines[k].fork&&first(k)===sp&&siblingsAt(lines[k].fork.of,lines[k].fork.after,LAST).length>=2);
  const cls=['mark', inCol?'':(st.hist==='one'?'hollow':'dot'), sp===st.step?'chosen':'', nest?'nest':'', notch?'notch':''].join(' ');
  return `<div class="${cls}" data-step="${sp}" title="${sp} · ${lines[l].label}${inCol?'':' (not in the column)'}">${sp}</div>`;
 }).join('');
}
function drawMini(){
 const col=$('col');
 $('mini').innerHTML=rows.map(r=>{
  const d=r.depth||0, bars='<i style="left:0"></i>'.repeat(0)+Array.from({length:d},(_,i)=>`<i style="left:${i*3}px"></i>`).join('');
  const g=`<div class="g${r.kind==='fork'?' notch':''}">${bars}</div>`;
  const c=r.kind==='blk'?`var(--c-${r.cat})`:r.kind==='fork'?'var(--c-fork)':r.kind==='x'?'var(--muted)':'transparent';
  return g+`<div class="s" style="background:${c};opacity:${r.added?1:.55}"></div>`;
 }).join('')+'<div class="box"></div>';
 placeBox();
}
function placeBox(){
 const col=$('col'), m=$('mini'), box=m.querySelector('.box'); if(!box) return;
 const total=col.scrollHeight, h=m.scrollHeight-12;
 box.style.top=(6+col.scrollTop/total*h)+'px'; box.style.height=Math.max(6,col.clientHeight/total*h)+'px';
}

// ---------- acts ----------
function choose(sp){ st.step=Math.max(1,Math.min(LAST,sp)); }
function stepTime(dir){
 if(st.hist==='one'){ choose(st.step+dir); draw(nearestForkKey()); return; }
 // kept: along the shown history. visible is computed at LAST under current choices.
 const save=st.step; st.step=LAST; build(); const vis=[...visible].sort((a,b)=>a-b); st.step=save;
 const next=dir>0?vis.find(x=>x>st.step):vis.slice().reverse().find(x=>x<st.step);
 if(next) choose(next); draw();
}
function nearestForkKey(){ // the fork row nearest above the view's top, else the first in view
 const col=$('col'), top=col.getBoundingClientRect().top;
 const els=[...document.querySelectorAll('[data-fork]')]; let best=null;
 for(const el of els){ if(el.getBoundingClientRect().top<=top+20) best=el; }
 return (best||els[0])?.dataset.fork||null;
}
function switchSibling(dir,key){
 key=key||nearestForkKey(); if(!key) return;
 const [l,after]=key.split('@'); const sibs=siblingsAt(l,+after,st.hist==='one'?LAST:LAST);
 const r=rows.find(r=>r.kind==='fork'&&r.line===l&&r.after===+after); const cur=r?r.shown:sibs[0];
 const n=sibs[(sibs.indexOf(cur)+dir+sibs.length)%sibs.length];
 pick(l,+after,n,key);
}
function pick(l,after,n,key){
 if(st.hist==='one'){ choose(n===l?lines[l].steps.find(x=>x>after):first(n)); draw(key); return; }
 st.choice[l+'@'+after]=n;
 // clamp the step onto the shown history
 const save=st.step; st.step=LAST; build(); const vis=[...visible].sort((a,b)=>a-b); st.step=save;
 if(!visible.has(st.step)){ const le=vis.slice().reverse().find(x=>x<=st.step); choose(le||(n===l?lines[l].steps.find(x=>x>after):first(n))); }
 draw(key);
}
function clickStep(sp){
 if(st.hist==='one'){ choose(sp); draw(nearestForkKey()); return; }
 // kept: switch every fork on the way to this step so it is shown, then choose it
 for(const l of chain(steps[sp].line)){ const f=lines[l].fork; if(f) st.choice[f.of+'@'+f.after]=l; }
 // and if the step is on a line that continues past a fork, choose the continuation
 const l=steps[sp].line; for(const k of Object.keys(lines)){ const f=lines[k].fork; if(f&&f.of===l&&sp>f.after) st.choice[l+'@'+f.after]=l; }
 choose(sp); draw();
}
function jumpFork(dir){
 const els=[...document.querySelectorAll('[data-fork]')]; if(!els.length) return;
 const i=rows.findIndex((r,i)=>i>st.focus&&r.kind==='fork'), j=rows.map((r,i)=>r.kind==='fork'&&i<st.focus?i:-1).filter(x=>x>=0).pop();
 const to=dir>0?(i>=0?i:rows.findIndex(r=>r.kind==='fork')):(j!=null?j:rows.map((r,i)=>r.kind==='fork'?i:-1).filter(x=>x>=0).pop());
 if(to>=0){ st.focus=to; draw(); scrollFocus(); }
}
function scrollFocus(){ const el=document.querySelectorAll('#col .row')[st.focus- (rows[0].kind==='crumb'?1:0)]; el&&el.scrollIntoView({block:'nearest'}); }

document.addEventListener('keydown',e=>{
 const k=e.key;
 if(k==='ArrowRight'){stepTime(1);} else if(k==='ArrowLeft'){stepTime(-1);}
 else if(k===']'){ const r=rows[st.focus]; switchSibling(1, r&&r.kind==='fork'?r.line+'@'+r.after:null); }
 else if(k==='['){ const r=rows[st.focus]; switchSibling(-1, r&&r.kind==='fork'?r.line+'@'+r.after:null); }
 else if(k==='j'){ st.focus=Math.min(rows.length-1,st.focus+1); draw(); scrollFocus(); }
 else if(k==='k'){ st.focus=Math.max(0,st.focus-1); draw(); scrollFocus(); }
 else if(k==='b'&&st.hist==='kept'){ jumpFork(1); } else if(k==='B'&&st.hist==='kept'){ jumpFork(-1); }
 else if(k==='Enter'){ const r=rows[st.focus]; if(r&&r.kind==='nest'){ if(r.enter){ st.stack.push(r.line); st.focus=0; $('col').scrollTop=0; } else { st.closed.has(r.line)?st.closed.delete(r.line):st.closed.add(r.line); } draw(); } }
 else if(k==='u'&&st.sub==='entered'&&st.stack.length){ st.stack.pop(); draw(); }
 else return;
 e.preventDefault();
});
$('col').addEventListener('click',e=>{
 const sib=e.target.closest('[data-sib]'); if(sib){ const f=sib.closest('[data-fork]'); const [l,after]=f.dataset.fork.split('@'); pick(l,+after,sib.dataset.sib,f.dataset.fork); return; }
 const n=e.target.closest('[data-nest]'); if(n){ const l=n.dataset.nest; if(st.sub==='entered'){ st.stack.push(l); st.focus=0; $('col').scrollTop=0; } else { st.closed.has(l)?st.closed.delete(l):st.closed.add(l); } draw(); }
});
$('strip').addEventListener('click',e=>{ const m=e.target.closest('[data-step]'); if(m) clickStep(+m.dataset.step); });
$('mini').addEventListener('click',e=>{ const m=$('mini'), col=$('col'); const y=e.clientY-m.getBoundingClientRect().top-6; col.scrollTop=y/(m.scrollHeight-12)*col.scrollHeight-col.clientHeight/2; });
$('col').addEventListener('scroll',placeBox);
for(const [id,key] of [['tHist','hist'],['tSub','sub']]) $(id).addEventListener('click',e=>{ const v=e.target.dataset.v; if(!v) return; st[key]=v; st.stack=[]; [...$(id).children].forEach(c=>c.classList.toggle('on',c.dataset.v===v)); draw(); });
[...$('tHist').children].forEach(c=>c.classList.toggle('on',c.dataset.v===st.hist));
[...$('tSub').children].forEach(c=>c.classList.toggle('on',c.dataset.v===st.sub));
draw();
if(q.get('bottom')) $('col').scrollTop=$('col').scrollHeight;
</script></body></html>
